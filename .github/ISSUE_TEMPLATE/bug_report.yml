name: Bug report
description: Something produced a wrong result, crashed, or behaved differently from the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, cookies, login state, or raw text collected from Xiaohongshu, Maimai, Boss or Nowcoder.
        Security problems go through private reporting instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The task you ran and the wrong result. Include job or result ids (J-123, R-45) when the agent cited them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `scripts/up.ps1 -Demo`
        2. Ask "..."
        3. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Synthetic demo
        - Local personal instance
        - Tests / CI
        - Collector
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or trace
      description: Relevant lines from data/logs, the API response, or the chat trace. Strip anything personal.
      render: text
