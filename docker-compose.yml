# 一条命令起数据库和服务：docker compose up -d --build
# 端口只绑在本机 127.0.0.1，外面访问不到。上云时（M9）再加 HTTPS 和反向代理。
name: polaris

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris}
      POSTGRES_DB: polaris
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://polaris:${POSTGRES_PASSWORD:-polaris}@db:5432/polaris
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
