[project]
name = "polaris"
version = "0.1.0"
description = "Polaris (北极星): a personal job-hunting agent for LLM and Agent internships"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3",
    "openai>=1.55",
    "typer>=0.13",
    "langgraph>=1.2.14",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=1.10",
    "langchain-mcp-adapters>=0.3.2",
    "langsmith>=0.14.7",
]

[project.scripts]
polaris = "polaris.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140  # 中文字符串多，放宽一点
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/polaris/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # typer 的参数默认值就是这么写的
    "UP046",  # 泛型先用 TypeVar 写法
    "UP047",
]
